<div class="rounded-2xl border border-violet-200 bg-violet-50/70 p-4 animate-map-fade-in">
  @if (payload?.title) {
    <p class="mb-2 text-base font-bold text-violet-900">{{ payload?.title }}</p>
  }

  @if (!hasData()) {
    <p class="text-sm text-violet-700">No table data available for this challenge.</p>
  } @else {
    <div class="overflow-x-auto rounded-xl bg-white">
      <table class="min-w-full text-left text-sm">
        <thead class="bg-violet-100 text-violet-900">
          <tr>
            @for (header of payload?.headers ?? []; track header) {
              <th class="px-4 py-3 text-sm font-bold">{{ header }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of payload?.rows ?? []; track $index) {
            <tr class="border-t border-violet-100 transition-all duration-200 hover:bg-violet-100/70 hover:shadow-[inset_0_0_0_1px_rgba(124,58,237,0.25)]">
              @for (cell of row; track $index) {
                <td class="px-4 py-3 text-base text-violet-900">{{ cell }}</td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
