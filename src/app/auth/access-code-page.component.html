<main class="page">

  <div class="header">
    <button class="back-btn" (click)="goBack()">← Back</button>
    <h2>Enter Access Code</h2>
  </div>

  <section class="card">
    <p class="subtitle">Enter your 6-character student access code to begin.</p>

    <input
      class="code-input"
      type="text"
      maxlength="8"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      [(ngModel)]="code"
      (input)="onCodeChange()"
      placeholder="K7P2QX"
    />

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button
      class="submit-btn"
      [disabled]="!isValid"
      (click)="submitCode()"
    >
      Continue
    </button>

    <a class="analyst-link" routerLink="/auth/analyst">Analyst? Enter access code</a>
  </section>

</main>
