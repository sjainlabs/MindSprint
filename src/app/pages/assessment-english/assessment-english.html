<div class="min-h-screen px-4 py-6 md:py-8">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <button 
        routerLink="/welcome"
        class="flex items-center text-primary hover:text-blue-600 font-semibold">
        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <h1 class="text-2xl md:text-3xl font-bold text-primary">📚 English Assessment</h1>
      <div class="w-16"></div>
    </div>

    <!-- XP Progress -->
    <app-xp-progress class="mb-6 block"></app-xp-progress>

    <!-- Timer -->
    <app-timer-bar class="block"></app-timer-bar>

    <!-- Question Card -->
    <app-question-card 
      [question]="'Choose the correct word: The cat ___ on the mat.'"
      [options]="[
        { id: 1, text: 'sit' },
        { id: 2, text: 'sits' },
        { id: 3, text: 'sitting' },
        { id: 4, text: 'sat' }
      ]">
    </app-question-card>
  </div>
</div>
