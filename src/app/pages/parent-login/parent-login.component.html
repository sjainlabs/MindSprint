<section class="auth-shell">
  <div class="auth-card">
    <a routerLink="/login" class="back-link">← Back</a>
    <h1>Parent Login</h1>
    <p>Use your Google account to access your dashboard.</p>

    <button type="button" class="google-btn" [disabled]="loading() || restoringSession()" (click)="loginWithGoogle()">
      @if (loading() || restoringSession()) {
        <span class="spinner"></span>
        {{ restoringSession() ? 'Completing sign-in...' : 'Signing in...' }}
      } @else {
        Login with Google
      }
    </button>

    @if (restoringSession()) {
      <p class="status-text">Finishing your Google sign-in and restoring your parent session…</p>
    }

    @if (errorMessage()) {
      <p class="error-text">{{ errorMessage() }}</p>
    }
  </div>
</section>
