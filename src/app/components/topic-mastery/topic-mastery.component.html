
<div class="space-y-4">
  <h3 class="text-lg font-semibold">Topic Mastery</h3>

  <div *ngIf="loading" class="text-sm text-gray-500">Loading topics...</div>

  <div *ngIf="!loading && insights.length === 0" class="text-sm text-gray-500">No topic insights available.</div>

  <ul class="space-y-2">
	<li *ngFor="let t of insights" class="p-3 bg-white rounded shadow-sm hover:shadow-md cursor-pointer" (click)="open(t)">
	  <div class="flex items-center justify-between">
		<div class="flex-1 pr-4">
		  <div class="font-medium">{{ t.name }}</div>
		  <div class="text-xs text-gray-600">Accuracy: {{ t.accuracy }}%</div>
		</div>
		<div class="w-48">
		  <app-mastery-progress [progressPercent]="t.mastery" [label]="t.name"></app-mastery-progress>
		</div>
	  </div>
	</li>
  </ul>

  <!-- detailed modal powered by DetailedTopicAnalysisComponent -->
  <div *ngIf="selectedInsight" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 p-4">
	<div class="bg-white rounded-lg p-4 w-full max-w-3xl">
	  <div class="flex items-center justify-between">
		<h4 class="text-xl font-semibold">{{ selectedInsight.name }}</h4>
		<div class="flex items-center gap-2">
		  <button class="text-gray-500" (click)="close()">✕</button>
		</div>
	  </div>

	  <div class="mt-4">
		<app-detailed-topic-analysis [topicInsight]="selectedInsight" [studentId]="studentId()"></app-detailed-topic-analysis>
	  </div>

	  <div class="mt-4 text-right">
		<button class="px-4 py-2 bg-blue-500 text-white rounded" (click)="close()">Close</button>
	  </div>
	</div>
  </div>
</div>
