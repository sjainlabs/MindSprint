<div class="min-h-screen bg-slate-50 px-4 py-6">
  <div class="mx-auto max-w-4xl space-y-6">

    <!-- Back -->
    <button
      class="rounded-full border border-primary px-4 py-2 text-sm font-semibold text-primary hover:bg-primary/10 transition"
      (click)="backToLibrary()"
    >
      ← Back to Topic Library
    </button>

    <!-- Loading -->
    <div
      *ngIf="loading()"
      class="rounded-3xl bg-white p-6 text-sm text-slate-500 shadow-sm ring-1 ring-slate-200"
    >
      Loading topic…
    </div>

    <!-- Error -->
    <div
      *ngIf="errorMessage()"
      class="rounded-3xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
    >
      {{ errorMessage() }}
    </div>

    <!-- Topic Detail -->
    <section
      *ngIf="topic() && !loading()"
      class="rounded-3xl bg-white p-6 shadow-sm ring-1 ring-slate-200 space-y-6"
    >
      <!-- Title -->
      <div>
        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
          {{ topic()?.name }}
        </h1>
      </div>
    </section>
  </div>
</div>
