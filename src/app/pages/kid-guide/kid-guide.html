<div class="min-h-screen bg-gradient-to-b from-sky-50 to-purple-50 py-6 px-4">
  <div class="max-w-3xl mx-auto rounded-3xl bg-white shadow-lg p-4 sm:p-6">
    <div class="flex items-center justify-between gap-3">
      <a routerLink="/onboarding" class="text-sm font-semibold text-primary underline">{{ backLabel() }}</a>
      <div class="flex items-center gap-3">
        <p class="text-xs sm:text-sm font-semibold text-gray-600">{{ stepLabel() }}</p>
        <app-language-toggle />
      </div>
    </div>

    <div class="mt-4 h-2 w-full rounded-full bg-gray-100">
      <div class="h-2 rounded-full bg-primary transition-all duration-300" [style.width.%]="progressPercent()"></div>
    </div>

    <section
      class="mt-5 rounded-3xl bg-gradient-to-br p-5 sm:p-6 text-center"
      [ngClass]="currentSlide().colorClass"
      aria-live="polite"
    >
      <p class="text-3xl sm:text-4xl">{{ currentSlide().icon }}</p>
      <h1 class="mt-2 text-2xl sm:text-3xl font-extrabold text-slate-800">{{ currentSlide().title }}</h1>
      <p class="mt-3 text-base sm:text-lg text-slate-700 leading-relaxed">{{ currentSlide().message }}</p>

      <div class="mx-auto mt-5 h-40 w-40 sm:h-48 sm:w-48 rounded-full border-4 border-white shadow-md grid place-items-center text-6xl sm:text-7xl"
        [ngClass]="currentSlide().illustrationClass"
        role="img"
        [attr.aria-label]="currentSlide().title + ' illustration'"
      >
        {{ currentSlide().illustrationLabel }}
      </div>
    </section>

    <div class="mt-6 flex flex-col sm:flex-row gap-3">
      <button
        type="button"
        class="w-full sm:w-auto sm:flex-1 rounded-2xl px-6 py-4 text-lg font-bold bg-gray-100 text-gray-700 disabled:opacity-50"
        (click)="previous()"
        [disabled]="isFirst()"
      >
        {{ backLabel() }}
      </button>

      @if (!isLast()) {
        <button
          type="button"
          class="w-full sm:w-auto sm:flex-1 rounded-2xl px-6 py-4 text-lg font-bold bg-primary text-white"
          (click)="next()"
        >
          {{ nextLabel() }}
        </button>
      } @else {
        <a
          routerLink="/topics"
          class="w-full sm:w-auto sm:flex-1 rounded-2xl px-6 py-4 text-lg font-bold bg-emerald-500 text-white text-center"
        >
          {{ startLabel() }}
        </a>
      }
    </div>
  </div>
</div>
