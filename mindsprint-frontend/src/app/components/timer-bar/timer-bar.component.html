<div class="w-full bg-white rounded-lg shadow-md p-4">
  <div class="flex justify-between items-center mb-2">
    <span class="text-sm font-semibold text-text">Time Remaining</span>
    <span class="text-lg font-bold" [class.text-red-500]="timeLeft <= 5" [class.text-primary]="timeLeft > 5">
      {{ timeLeft }}s
    </span>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
    <div 
      class="h-full transition-all duration-1000 ease-linear rounded-full"
      [class.bg-primary]="percentage > 30"
      [class.bg-accent]="percentage <= 30 && percentage > 10"
      [class.bg-red-500]="percentage <= 10"
      [style.width.%]="percentage">
    </div>
  </div>
</div>
