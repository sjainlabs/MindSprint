<div class="bg-white rounded-lg p-4 shadow-md">
  <h3 class="text-lg font-semibold text-text mb-4">Choose Your Avatar</h3>
  <div class="grid grid-cols-4 gap-3">
    <button
      *ngFor="let avatar of avatars"
      (click)="selectAvatar(avatar)"
      [class.ring-2]="selectedAvatar === avatar"
      [class.ring-primary]="selectedAvatar === avatar"
      class="text-4xl p-3 rounded-lg hover:bg-gray-100 transition-all duration-200 transform hover:scale-110">
      {{ avatar }}
    </button>
  </div>
  <div class="mt-4 text-center">
    <p class="text-sm text-gray-600">Selected: <span class="text-3xl">{{ selectedAvatar }}</span></p>
  </div>
</div>
