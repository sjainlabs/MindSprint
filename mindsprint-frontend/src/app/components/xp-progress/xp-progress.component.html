<div class="bg-white rounded-lg shadow-md p-4">
  <div class="flex justify-between items-center mb-2">
    <div class="flex items-center gap-2">
      <span class="text-2xl">⭐</span>
      <span class="text-sm font-semibold text-text">Level {{ level }}</span>
    </div>
    <span class="text-sm font-bold text-accent">{{ currentXP }} / {{ maxXP }} XP</span>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
    <div 
      class="h-full bg-gradient-to-r from-accent to-primary transition-all duration-500 rounded-full flex items-center justify-end pr-1"
      [style.width.%]="percentage">
      <span class="text-xs text-white font-bold" *ngIf="percentage > 15">{{ percentage.toFixed(0) }}%</span>
    </div>
  </div>
</div>
