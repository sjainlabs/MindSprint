<div class="min-h-screen p-4 py-6">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-primary mb-4 flex items-center gap-2">
        <span>🔬</span>
        <span>Science Assessment</span>
      </h1>
      <app-xp-progress [currentXP]="xp" [maxXP]="100" [level]="level"></app-xp-progress>
    </div>
    
    <!-- Timer -->
    <div class="mb-6">
      <app-timer-bar [duration]="30"></app-timer-bar>
    </div>
    
    <!-- Question Card -->
    <app-question-card
      [question]="currentQuestion"
      [currentQuestion]="currentQuestionIndex + 1"
      [totalQuestions]="questions.length"
      (answerSelected)="handleAnswer($event)">
    </app-question-card>
  </div>
</div>
