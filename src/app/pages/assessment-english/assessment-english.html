<div class="min-h-screen px-4 py-6 md:py-8">
  <div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <button 
        routerLink="/welcome"
        class="flex items-center text-primary hover:text-blue-600 font-semibold">
        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Back
      </button>
      <h1 class="text-2xl md:text-3xl font-bold text-primary">📚 English Assessment</h1>
      <div class="w-16"></div>
    </div>

    <!-- XP Progress -->
    <app-xp-progress class="mb-6 block"></app-xp-progress>

    <!-- Timer -->
    <app-timer-bar class="block"></app-timer-bar>

    <!-- Question Card -->
    <app-question-card 
      *ngIf="currentQuestion"
      [questionNumber]="currentQuestionIndex + 1"
      [totalQuestions]="questions.length"
      [question]="currentQuestion.question"
      [options]="currentQuestion.options"
      [points]="currentQuestion.points">
    </app-question-card>

    <!-- Navigation Buttons -->
    <div class="flex gap-4 mt-6">
      <button 
        (click)="previousQuestion()"
        [disabled]="currentQuestionIndex === 0"
        class="flex-1 py-3 px-6 bg-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-400 disabled:opacity-50 disabled:cursor-not-allowed">
        Previous
      </button>
      <button 
        (click)="nextQuestion()"
        [disabled]="currentQuestionIndex === questions.length - 1"
        class="flex-1 py-3 px-6 bg-primary text-white font-semibold rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">
        Next
      </button>
    </div>

    <!-- Submit Button (shown on last question) -->
    <button 
      *ngIf="currentQuestionIndex === questions.length - 1"
      routerLink="/results"
      class="w-full mt-4 py-3 px-6 bg-accent text-white font-semibold rounded-lg hover:bg-orange-600">
      Submit Assessment
    </button>
  </div>
</div>
