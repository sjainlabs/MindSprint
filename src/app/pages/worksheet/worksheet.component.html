<div class="max-w-3xl mx-auto p-6">
  <div class="bg-white rounded-lg p-6 shadow">
    <h2 class="text-xl font-semibold">Worksheet</h2>

    <div class="mt-4">
      <div class="text-sm text-gray-600">Progress</div>
      <div class="w-full bg-gray-200 rounded h-3 mt-2">
        <div class="h-3 rounded bg-emerald-500" [style.width.%]="percentComplete()"></div>
      </div>
      <div class="text-xs text-gray-500 mt-1">{{ percentComplete() }}% complete</div>
    </div>

    <div class="mt-6">
      <div class="text-sm text-gray-700">Question {{ currentIndex + 1 }} of {{ questions.length }}</div>
      <div class="mt-2 p-4 border rounded bg-gray-50">
        <div class="font-medium">{{ questions[currentIndex].prompt }}</div>
      </div>

      <div class="mt-4">
        <label class="block text-sm text-gray-600">Your answer</label>
        <input [(ngModel)]="answer" class="mt-1 w-full rounded border p-2" />
      </div>

      <div class="mt-4 text-sm text-red-600">{{ feedback }}</div>

      <div class="mt-4 flex gap-3">
        <button class="px-4 py-2 bg-blue-600 text-white rounded" (click)="next()" [disabled]="loading || answers.length >= questions.length">Next</button>
        <button class="px-4 py-2 bg-green-600 text-white rounded" (click)="submit()" [disabled]="loading">Submit</button>
      </div>
    </div>
  </div>
</div>
