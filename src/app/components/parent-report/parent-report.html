<div class="parent-report">
  <button 
    (click)="toggleReport()"
    class="text-sm text-primary hover:text-blue-600 underline font-medium">
    👨‍👩‍👧 Parent Report
  </button>

  @if (showReport) {
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" (click)="toggleReport()">
      <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full" (click)="$event.stopPropagation()">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold text-text">Parent Report</h3>
          <button (click)="toggleReport()" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>

        <div class="space-y-4">
          <div class="border-b pb-3">
            <h4 class="font-semibold text-text mb-2">Overall Progress</h4>
            <div class="grid grid-cols-3 gap-3 text-center">
              <div class="bg-background rounded p-2">
                <div class="text-2xl font-bold text-primary">85%</div>
                <div class="text-xs text-gray-600">Math</div>
              </div>
              <div class="bg-background rounded p-2">
                <div class="text-2xl font-bold text-primary">78%</div>
                <div class="text-xs text-gray-600">English</div>
              </div>
              <div class="bg-background rounded p-2">
                <div class="text-2xl font-bold text-primary">92%</div>
                <div class="text-xs text-gray-600">Science</div>
              </div>
            </div>
          </div>

          <div class="border-b pb-3">
            <h4 class="font-semibold text-text mb-2">Recent Activity</h4>
            <div class="text-sm text-gray-600 space-y-1">
              <p>✓ Completed Math Level 5</p>
              <p>✓ 15 questions answered today</p>
              <p>✓ 5 day streak! 🔥</p>
            </div>
          </div>

          <div>
            <h4 class="font-semibold text-text mb-2">Strengths & Areas to Improve</h4>
            <div class="text-sm space-y-2">
              <div class="flex items-start">
                <span class="text-green-500 mr-2">✓</span>
                <span class="text-gray-600">Strong in multiplication</span>
              </div>
              <div class="flex items-start">
                <span class="text-accent mr-2">!</span>
                <span class="text-gray-600">Practice division word problems</span>
              </div>
            </div>
          </div>
        </div>

        <button 
          (click)="toggleReport()"
          class="mt-6 w-full bg-primary hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200">
          Close
        </button>
      </div>
    </div>
  }
</div>
