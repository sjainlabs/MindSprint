<div class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <h1 class="text-4xl md:text-5xl font-bold text-primary mb-4">
      🎮 MindSprint
    </h1>
    <p class="text-lg md:text-xl text-gray-600 mb-8">
      Gamified Learning for Grades 1-2
    </p>
    
    <div class="bg-white rounded-lg shadow-lg p-8 mb-6">
      <div class="mb-6">
        <div class="text-6xl mb-4">🚀</div>
        <h2 class="text-2xl font-semibold text-text mb-2">Ready to Learn?</h2>
        <p class="text-gray-600">
          Complete fun assessments and earn XP points!
        </p>
      </div>
      
      <button 
        (click)="startAssessment()"
        class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-lg transition-colors duration-200 text-lg">
        Start Your Adventure
      </button>
    </div>
    
    <div class="grid grid-cols-3 gap-4 text-center">
      <div class="bg-white p-4 rounded-lg shadow">
        <div class="text-2xl mb-1">📐</div>
        <p class="text-sm text-gray-600">Math</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <div class="text-2xl mb-1">📚</div>
        <p class="text-sm text-gray-600">English</p>
      </div>
      <div class="bg-white p-4 rounded-lg shadow">
        <div class="text-2xl mb-1">🔬</div>
        <p class="text-sm text-gray-600">Science</p>
      </div>
    </div>
  </div>
</div>
