<main class="page">

  <div class="header">
    <button class="back-btn" (click)="router.navigate(['/student-dashboard'])">← Back</button>
    <h2>Practice Hub</h2>
  </div>

  <!-- Recommended Section -->
  <section class="card">
    <h3>Recommended for you:</h3>
    <p class="recommended">{{ recommendedTopic() }}</p>

    <button class="action-btn" (click)="startRecommendedWorksheet()">
      Start Recommended Worksheet
    </button>
  </section>

  <!-- Level Selection -->
  <section class="card">
    <h3>Practice Levels</h3>

    <div class="level-list">
      <button
        *ngFor="let lvl of levels"
        class="level-btn"
        [class.active]="selectedLevel() === lvl"
        (click)="selectedLevel.set(lvl)"
      >
        {{ lvl }}
      </button>
    </div>
  </section>

  <!-- Grade Selection -->
  <section class="card">
    <h3>Select Grade</h3>

    <select class="select-box" [(ngModel)]="selectedGrade" (change)="loadTopicsV2()">
      <option value="" disabled selected>Select grade</option>
      <option *ngFor="let g of grades" [value]="g">{{ g }}</option>
    </select>
  </section>

  <!-- Topic Selection (MULTI-SELECT) -->
  <section class="card">
    <h3>Select Topics</h3>

    <div *ngIf="loadingTopics()">Loading topics...</div>

    <select
      class="select-box"
      multiple
      [(ngModel)]="selectedTopics"
      [disabled]="topics().length === 0"
    >
      <option *ngFor="let t of topics()" [value]="t.id">
        {{ t.name }}
      </option>
    </select>

    <button class="dropdown-btn">Topic Map ▼</button>
    <button class="dropdown-btn">Topic Library ▼</button>
  </section>

  <!-- Question Count -->
  <section class="card">
    <h3>Number of Questions</h3>

    <input
      class="number-input"
      type="number"
      min="5"
      max="50"
      [(ngModel)]="questionCount"
    />
  </section>

  <!-- Generate Worksheet -->
  <button
    class="action-btn generate-btn"
    [disabled]="!selectedGrade() || selectedTopics().length === 0"
    (click)="generatePractice()"
  >
    Generate Practice Worksheet
  </button>

</main>
