<div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
  <div class="mb-4 flex justify-between items-center">
    <span class="text-sm text-gray-500">Question {{ currentQuestion }} of {{ totalQuestions }}</span>
    <div class="flex gap-1">
      <div *ngFor="let i of [].constructor(totalQuestions); let idx = index"
           [class.bg-primary]="idx < currentQuestion"
           [class.bg-gray-300]="idx >= currentQuestion"
           class="w-2 h-2 rounded-full">
      </div>
    </div>
  </div>
  
  <h2 class="text-xl md:text-2xl font-bold text-text mb-6">
    {{ question.question }}
  </h2>
  
  <div class="space-y-3 mb-6">
    <button
      *ngFor="let option of question.options; let i = index"
      (click)="selectOption(i)"
      [class.ring-2]="selectedOption === i"
      [class.ring-primary]="selectedOption === i"
      [class.bg-blue-50]="selectedOption === i"
      class="w-full text-left p-4 rounded-lg border-2 border-gray-200 hover:border-primary transition-all duration-200 transform hover:scale-102">
      <span class="font-semibold text-primary mr-2">{{ String.fromCharCode(65 + i) }}.</span>
      <span class="text-text">{{ option }}</span>
    </button>
  </div>
  
  <button
    (click)="submitAnswer()"
    [disabled]="selectedOption === null"
    [class.opacity-50]="selectedOption === null"
    [class.cursor-not-allowed]="selectedOption === null"
    class="w-full bg-accent hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200 disabled:hover:bg-accent">
    Submit Answer
  </button>
</div>
