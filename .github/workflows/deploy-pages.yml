name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build -- --base-href /MindSprint/

      - name: Prepare publish directory
        run: |
          set -e
          mkdir -p publish
          echo "Contents of dist:"
          ls -la dist || true
          # Angular outputs to dist/mindsprint-app/browser
          if [ -d "dist/mindsprint-app/browser" ]; then
            echo "Found Angular browser directory"
            cp -a dist/mindsprint-app/browser/. publish/
          else
            echo "::error::Expected dist/mindsprint-app/browser directory not found"
            exit 1
          fi
          echo "Contents of publish:"
          ls -la publish || true
          if [ -f publish/index.html ]; then
            echo "index.html found in publish"
          else
            echo "::error::index.html not found in publish"
            exit 1
          fi

      - name: Disable Jekyll so README.md won't be served instead of site
        run: |
          touch publish/.nojekyll
          echo ".nojekyll created"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
