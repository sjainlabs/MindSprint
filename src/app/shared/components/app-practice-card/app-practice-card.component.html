<div class="practice-card" [class.selected]="selected" (click)="toggle.emit()" role="button" tabindex="0">
  <div class="card-top">
    <!-- Topic icons are usually an emoji; only a path or URL goes in an <img> -->
    <img *ngIf="iconIsImage; else emojiIcon" class="topic-icon" [src]="topic?.icon || 'assets/mascots/penguin.svg'" alt="" />
    <ng-template #emojiIcon>
      <span class="topic-icon emoji" aria-hidden="true" [style.background]="(topic?.color || '#4F46E5') + '1a'">{{ topic?.icon }}</span>
    </ng-template>
    <div class="title-group">
      <h4>{{ topic?.name }}</h4>
      <!-- Grade Badge -->
      <span class="grade-badge" [attr.data-grade]="topic?.cbseGrade">
  G{{ topic?.cbseGrade }}
</span>


      <span class="level">{{ topic?.practiceLevel || 'Beginner' }}</span>
      <span class="band" *ngIf="topic?.band">Band {{ topic.band }}</span>
      <span class="challenge" *ngIf="topic?.challenge" [title]="topic.challenge === 'sat-act' ? 'SAT/ACT-style practice. Optional: not part of the learning plan.' : 'Olympiad-style puzzles. Optional: not part of the learning plan.'">
        {{ topic.challenge === 'sat-act' ? '🎯 SAT/ACT' : '🏅 Olympiad' }} · optional
      </span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progress"></div>
    </div>
    <div class="progress-label">{{ progress }}%</div>
  </div>

  <!-- Optional extras for this topic (e.g. topic test status) -->
  <ng-content></ng-content>

  <div class="card-actions">
    <button class="start-btn" (click)="$event.stopPropagation(); start.emit();">Start Practice</button>
    <a
      *ngIf="guideLink"
      class="guide-btn"
      [routerLink]="guideLink"
      [attr.aria-label]="'Study guide for ' + topic?.name"
      (click)="$event.stopPropagation()"
    >📘 Study guide</a>
  </div>
</div>
