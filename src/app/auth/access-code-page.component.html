<main class="page">

  <h2>Enter Access Code</h2>

  <section class="card">
    <p class="subtitle">Enter your 6-character student access code to begin. Got an 8-character analyst code? It works here too.</p>

    <input
      class="code-input"
      type="text"
      maxlength="8"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      [value]="code"
      (input)="onCodeChange($event)"
      (keydown.enter)="submitCode()"
      placeholder="K7P2QX"
      title="Students: the 6-character code from your parent. Analysts: the 8-character code a parent shared"
      aria-label="Student access code"
    />

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button
      class="submit-btn"
      type="button"
      [disabled]="!isValid"
      [title]="!isValid ? 'Type all 6 characters of a student code, or 8 of an analyst code' : isAnalystCode ? 'Open the read-only report a parent shared' : 'Log in and open your dashboard'"
      (click)="submitCode()"
    >
      Continue
    </button>

    <a class="analyst-link" routerLink="/auth/analyst" title="For someone a parent shared a read-only report with: enter the 8-character analyst code">Analyst? Enter access code</a>
  </section>

</main>
