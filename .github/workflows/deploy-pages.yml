name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare publish directory (flatten Angular dist if needed)
        run: |
          set -e
          mkdir -p publish
          echo "Contents of dist:"
          ls -la dist || true
          # If dist contains a single nested directory (common for Angular), copy its contents
          NESTED_DIR=$(find dist -maxdepth 1 -mindepth 1 -type d | head -n 1 || true)
          if [ -n "$NESTED_DIR" ]; then
            echo "Found nested dist directory: $NESTED_DIR"
            cp -a "$NESTED_DIR/." publish/
          else
            echo "No nested dist directory; copying dist contents"
            cp -a dist/. publish/ || true
          fi
          echo "Contents of publish:"
          ls -la publish || true
          if [ -f publish/index.html ]; then
            echo "index.html found in publish"
          else
            echo "::warning::index.html not found in publish — Pages may render README.md or fallback content"
          fi

      - name: Disable Jekyll so README.md won't be served instead of site
        run: |
          touch publish/.nojekyll
          echo ".nojekyll created"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
